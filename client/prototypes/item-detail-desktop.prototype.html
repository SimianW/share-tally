<body>
<div class="desktop-hint">Desktop study · designed for widths of 1100px and above</div>
<div id="app"></div>
<div id="switcher" class="switcher" aria-label="Prototype layout switcher"></div>
<div id="announcer" class="sr-only" aria-live="polite"></div>
<dialog id="summary-dialog" aria-labelledby="summary-title"></dialog>
<dialog id="custom-dialog" aria-labelledby="custom-title"></dialog>
<script>
'use strict';
// Entirely fictional data. In-memory selections are shared by all four studies.
const people=[['You','#ffc23a','Y'],['Ana','#dde8c8','A'],['Ben','#f6d2dc','B'],['Chen','#cfe2f3','C'],['Dee','#f8d9bd','D'],['Eli','#e0d6f2','E']];
const seed=[
['Jasmine rice · 8 kg',2299,'T&T JASMINE RICE 8KG'],['Spicy shrimp crackers',287,'(SALE) HONGSHIM SPICY SHRIMP CRACKERS 195606 2 @2/$2.87 U $2.87 8 F',true],['Shanghai bok choy',439,'SHANGHAI BOK CHOY 上海青 0.732KG'],['Frozen pork dumplings',899,'SYNEAR PORK DUMPLING 800G'],['Fresh firm tofu',249,'FRESH FIRM TOFU 454G'],['Korean strawberries',1299,'KOREAN STRAWBERRY 350G'],['Baby king oyster mushrooms',399,'KING OYSTER MUSHROOM 200G'],['Chili crisp',649,'LAO GAN MA CHILI CRISP 210G'],['Udon noodles · 5 pack',599,'SANUKI UDON 5X200G'],['Coconut milk',229,'AROY-D COCONUT MILK 400ML'],['Taiwanese pineapple cakes',1099,'CHIA TE PINEAPPLE CAKE 250G'],['Green onions · 3 bunches',249,'GREEN ONION 3 @0.83'],['Japanese eggs · 12',799,'PREMIUM EGGS LARGE 12CT'],['Chicken thighs',1184,'CHICKEN THIGH BONELESS 0.846KG'],['Atlantic salmon fillet',1869,'ATLANTIC SALMON 0.623KG'],['Bean sprouts',179,'BEAN SPROUTS 454G'],['Sliced hot pot beef',1599,'BEEF SHORT PLATE SLICE 400G'],['Fish balls',649,'CHIU CHOW FISH BALL 340G'],['Enoki mushrooms',199,'ENOKI MUSHROOM 200G'],['Hot pot soup base',499,'HAIDILAO TOMATO SOUP 200G'],['Napa cabbage',584,'NAPA CABBAGE 白菜 1.460KG'],['Sweet potato noodles',349,'SWEET POTATO VERMICELLI 400G'],['Soy sauce',429,'LEE KUM KEE LIGHT SOY 500ML'],['Sesame oil',599,'KADOYA SESAME OIL 163ML'],['Rice vinegar',299,'MIZKAN RICE VINEGAR 355ML'],['Gochujang',649,'CJ GOCHUJANG 500G'],['Roasted seaweed',399,'BIBIGO SEAWEED SNACK 3PK',true],['Pocky matcha',249,'GLICO POCKY MATCHA 70G',true],['Mango mochi',499,'ROYAL FAMILY MANGO MOCHI 210G',true],['Lychee jelly cups',699,'COCON LYCHIE JELLY 420G',true],['Calpico · 4 bottles',799,'CALPICO ORIGINAL 4X300ML',true],['Oolong tea',349,'ITO EN OOLONG TEA 2L',true],['Brown sugar boba ice cream',899,'SHAO MEI BOBA ICE BAR 4PK',true],['Red bean buns',549,'T&T RED BEAN BUN 6CT'],['Scallion pancakes',429,'I-MEI GREEN ONION PANCAKE 5PK'],['Sesame tang yuan',399,'SYNEAR SESAME RICE BALL 400G'],['Dragon fruit',587,'WHITE DRAGON FRUIT 0.839KG'],['Honey pomelo',699,'HONEY POMELO EACH'],['Fuji apples',748,'FUJI APPLE 1.250KG'],['Asian pears',649,'ASIAN PEAR 3CT'],['Fresh ginger',183,'GINGER ROOT 0.246KG'],['Garlic · 3 bulbs',149,'GARLIC 3CT'],['Cilantro',129,'CORIANDER BUNCH'],['Reusable shopping bag',199,'T&T REUSABLE BAG',true]
];
const items=seed.map((s,i)=>({id:i,name:s[0],printed:s[1],original:s[2],tax:s[3]?Math.round(s[1]*.125):0,others:[],mine:0,review:false,reviewed:false}));
items.forEach(i=>i.final=i.printed+i.tax);
items[0].others=[{p:1,f:1/3},{p:2,f:1/3}];items[0].mine=1/6;
items[2].others=[{p:1,f:1/4},{p:2,f:1/4}];
items[3].others=[{p:3,f:.5},{p:4,f:.5}];
items[5].mine=.5;items[5].review=true;items[5].old=1099;
items[7].others=[{p:5,f:1/3}];items[7].mine=1/3;
items[8].mine=.5;items[10].others=[{p:1,f:.5},{p:5,f:.5}];
items[13].others=[{p:2,f:.5}];items[16].review=true;items[16].old=1499;
items[20].mine=1/4;items[26].others=[{p:3,f:.5}];items[31].others=[{p:4,f:1}];
const names={A:'Split view',B:'Receipt-first',C:'Claim table',D:'Focus mode'};
let variant=new URLSearchParams(location.search).get('variant')?.toUpperCase()||'A';if(!names[variant])variant='A';
let selected=1,filter='All',expanded=new Set(),autoAdvance=true,focusOpen=true,advanceTimer,toastTimer,customId=null,confirmed=false;
const app=document.getElementById('app');
const money=c=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(c/100);
const sum=fn=>items.reduce((a,i)=>a+fn(i),0);
const total=()=>sum(i=>i.final),share=()=>sum(i=>Math.round(i.final*i.mine)),claimed=()=>items.filter(i=>i.mine>0).length;
const room=i=>Math.max(0,1-i.others.reduce((s,o)=>s+o.f,0));
const free=i=>Math.max(0,room(i)-i.mine);
const pending=()=>items.filter(i=>i.review&&!i.reviewed);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const frac=f=>{if(f<.0001)return '0';if(Math.abs(f-1)<.0001)return '1';for(let d=2;d<=100;d++)for(let n=1;n<d;n++)if(Math.abs(f-n/d)<.0001)return n+'/'+d;return f.toFixed(2)};
const avatar=(p)=>`<span class="avatar" style="background:${people[p][1]}" title="${people[p][0]}">${people[p][2]}</span>`;
function meter(i,mini=false){let label=i.others.map(o=>people[o.p][0]+' '+frac(o.f)).join(', ');return `<div class="meter ${mini?'mini':''}" role="img" aria-label="${label}; you ${frac(i.mine)}; free ${frac(free(i))}">${i.others.map(o=>`<span class="segment" style="width:${o.f*100}%;background:${people[o.p][1]}">${mini?'':people[o.p][2]}</span>`).join('')}${i.mine?`<span class="segment mine" style="width:${i.mine*100}%">${mini?'':'You'}</span>`:''}${free(i)>.0001?`<span class="segment free" style="width:${free(i)*100}%">${mini?'':'Free'}</span>`:''}</div>`}
function legend(i){return `<div class="legend">${i.others.map(o=>`<span class="flex" style="gap:4px">${avatar(o.p)} ${people[o.p][0]} · ${frac(o.f)}</span>`).join('')}${i.mine?`<span><i class="dot"></i>You · ${frac(i.mine)}</span>`:''}${free(i)>.0001?`<span>◌ Free · ${frac(free(i))}</span>`:''}</div>`}
function header(){return `<header class="topbar"><div class="flex"><div class="brand"><span class="brand-mark">÷</span>ShareTally</div><span class="breadcrumb">Weekend groceries &nbsp; / &nbsp; Bills &nbsp; / &nbsp; T&T Supermarket</span></div><div class="flex"><span class="small muted">Your group, all square.</span>${avatar(0)}</div></header><section class="billhead"><div><h1>T&T Supermarket</h1><p>October 12, 2026 &nbsp;·&nbsp; Paid by Ana &nbsp;·&nbsp; 44 items</p></div><div class="bill-meta"><div class="meta-total"><span class="eyebrow">Bill total · CAD</span><strong class="money">${money(total())}</strong></div><div class="people"><div><div class="avatars">${people.map((_,p)=>avatar(p)).join('')}</div><div class="people-label">You, Ana, Ben, Chen, Dee & Eli</div></div><span class="badge green">Open for claims</span></div></div></section>`}
function footer(){return `<footer class="footer"><div class="footer-left">${pending().length?`<button class="review-shortcut" data-action="next-review">◉ &nbsp; ${pending().length} items changed — review</button>`:`<span class="badge green">✓ All changes reviewed</span>`}<button class="text-btn" data-action="summary">Receipt summary</button></div><div class="footer-share"><div><span class="eyebrow">Your share</span><strong class="money" data-share>${money(share())}</strong><small>${claimed()} items ${confirmed?'· confirmed in this demo':'· not submitted'}</small></div><button class="primary" data-action="confirm">${confirmed?'Confirmed ✓':'Confirm my share'}</button></div></footer>`}
function notice(i){if(!i.review)return '';return `<div class="notice ${i.reviewed?'reviewed':''}"><div><strong>${i.reviewed?'✓ Price reviewed':'Price changed — review'}</strong><br><span class="small">${money(i.old)} → ${money(i.final)}${i.mine?' · Your portion is reserved.':''}</span></div>${i.reviewed?'':`<button class="text-btn" data-action="review" data-id="${i.id}">Mark reviewed</button>`}</div>`}
function crop(i){const previous=items[Math.max(0,i.id-1)],next=items[Math.min(43,i.id+1)];return `<div class="receipt-crop" role="img" aria-label="Simulated receipt crop for ${esc(i.name)}; highlighted printed price ${money(i.printed)}"><div class="crop-paper"><div style="opacity:.45">${esc(previous.original.slice(0,29))} &nbsp;${money(previous.printed)}</div><div class="crop-highlight">${esc(i.original.slice(0,45))}<br><span style="float:right">${money(i.printed)} &nbsp; F</span> ${i.id===1?'2 @2/$2.87 U':'QTY 1'}</div><div style="opacity:.45">${esc(next.original.slice(0,29))} &nbsp;${money(next.printed)}</div></div></div>`}
function breakdown(i){return `<dl class="breakdown"><div><dt>Printed price</dt><dd class="money">${money(i.printed)}</dd></div><div><dt>Own discount</dt><dd>−$0.00</dd></div><div><dt>Receipt discount share</dt><dd>−$0.00</dd></div><div><dt>Tax share</dt><dd>${money(i.tax)}</dd></div><div><dt>Other adjustments share</dt><dd>$0.00</dd></div><div class="final"><dt>Final cost</dt><dd class="money">${money(i.final)}</dd></div></dl>`}
function portion(i){return `<div class="portion-card"><div class="eyebrow">Your portion</div><div class="portion-figure"><strong class="money">${money(Math.round(i.final*i.mine))}</strong><span>${i.mine?frac(i.mine)+' of '+money(i.final):'Pick a portion of '+money(i.final)}</span></div>${meter(i)}${legend(i)}</div>`}
function choices(i,inline=false){const opts=inline?[['All',1],['¹⁄₂',.5],['¹⁄₃',1/3],['¹⁄₄',.25],['¹⁄₅',.2],['¹⁄₆',1/6,'even']]:[['¹⁄₆',1/6,'even'],['All',1],['¹⁄₂',.5],['¹⁄₃',1/3],['¹⁄₄',.25],['¹⁄₅',.2]];return `<div class="${inline?'inline-choices':'choices'}" role="group" aria-label="Portion for ${esc(i.name)}">${opts.map((o,n)=>`<button class="choice" data-action="pick" data-id="${i.id}" data-fraction="${o[1]}" ${o[1]>room(i)+.0001?'disabled':''} aria-pressed="${Math.abs(i.mine-o[1])<.0001}" title="${o[0]} of ${i.name} · ${money(Math.round(i.final*o[1]))}${o[1]>room(i)+.0001?' · unavailable':''}">${o[2]?'<span class="even">EVEN</span>':''}<span class="fraction">${o[0]}</span><span class="cost">${money(Math.round(i.final*o[1]))}</span><span class="key">${n+1}</span></button>`).join('')}<button class="choice" data-action="custom" data-id="${i.id}" ${room(i)<.0001?'disabled':''} aria-pressed="${i.mine>0&&!opts.some(o=>Math.abs(o[1]-i.mine)<.0001)}"><span class="fraction" style="font-size:${inline?11:12}px">… Custom</span>${inline?'':'<span class="cost">Fraction</span><span class="key">7</span>'}</button></div>`}
function help(i){return `<p class="help"><strong>${frac(room(i))} available to you.</strong> ${room(i)<.0001?'This item is fully claimed by others.':'Other claims and reservations hold the rest.'}<br>Your choices are not submitted until you confirm.</p>`}
function panel(i,receipt=false){return `<aside class="pane" aria-label="Claim selected item"><div class="pane-head"><div class="flex between"><span class="eyebrow">Claim an item · ${i.id+1} of 44</span>${nav()}</div><h2>${esc(i.name)}</h2></div><div class="pane-body">${notice(i)}${receipt?`${portion(i)}${choices(i)}${help(i)}<div class="breakdown-grid"><div><span class="eyebrow">How this cost was calculated</span>${breakdown(i)}</div><div><span class="eyebrow">On the receipt</span><p class="original mono">${esc(i.original)}</p><p class="help" style="margin-top:18px">The line on the left is highlighted on your receipt.</p></div></div>`:`<div class="evidence-grid"><div><span class="eyebrow">Item on the receipt</span>${crop(i)}<p class="original mono">${esc(i.original)}</p></div><div><span class="eyebrow">How this cost was calculated</span>${breakdown(i)}</div></div>${portion(i)}${choices(i)}${help(i)}`}<div class="panel-bottom">${i.mine?`<button class="text-btn" data-action="remove" data-id="${i.id}">Remove my claim</button>`:'<span></span>'}<span class="kbd-line"><kbd>↑</kbd> <kbd>↓</kbd> items &nbsp; <kbd>1</kbd>–<kbd>7</kbd> portion</span></div></div></aside>`}
function nav(){return `<div class="nav-pair"><button class="icon-btn" data-action="prev" aria-label="Previous item" ${selected===0?'disabled':''}>←</button><button class="icon-btn" data-action="next" aria-label="Next item" ${selected===43?'disabled':''}>→</button></div>`}
function filterControls(){return `<div class="filters" role="group" aria-label="Filter items">${['Unclaimed','Yours','All'].map(f=>`<button class="filter ${f===filter?'active':''}" data-action="filter" data-filter="${f}" aria-pressed="${f===filter}">${f}<span>${f==='Yours'?claimed():f==='Unclaimed'?items.filter(i=>free(i)>.0001).length:44}</span></button>`).join('')}</div>`}
function visibleItems(){return items.filter(i=>filter==='All'||filter==='Yours'&&i.mine>0||filter==='Unclaimed'&&free(i)>.0001)}
function itemRow(i){return `<button class="item-row ${i.id===selected?'selected':''}" data-action="select" data-id="${i.id}" aria-pressed="${i.id===selected}" data-row="${i.id}"><span class="row-no">${String(i.id+1).padStart(2,'0')}</span><span><span class="item-name">${esc(i.name)} ${i.review&&!i.reviewed?'<span class="badge" style="margin-left:6px">Price changed</span>':''}</span><span class="row-sub">${meter(i,true)}<span>${free(i)<.0001?'Fully claimed':frac(free(i))+' left'}</span><span class="avatars">${i.others.map(o=>avatar(o.p)).join('')}${i.mine?avatar(0):''}</span></span></span><span class="row-price money">${money(i.final)}${i.mine?`<small>You ${money(Math.round(i.final*i.mine))}</small>`:''}</span><span class="chev">›</span></button>`}
function list(){const v=visibleItems();return `<section class="list-card"><div class="list-heading"><div class="flex between"><div><h2>Items & claims</h2><p class="small muted">Select an item. Pick your portion.</p></div></div>${filterControls()}</div><div class="item-list">${v.length?v.map(itemRow).join(''):'<p class="empty">No items in this filter.</p>'}</div><div class="table-key"><kbd>J</kbd> <kbd>K</kbd> or <kbd>↑</kbd> <kbd>↓</kbd> to move &nbsp;·&nbsp; Selected item stays open on the right</div></section>`}
function VariantA(){return `${header()}<main class="work split">${list()}${panel(items[selected])}</main>${footer()}`}
function receiptLine(i){return `<button class="receipt-line ${i.others.length?'other':''} ${i.mine?'yours':''} ${selected===i.id?'selected':''}" data-action="select" data-id="${i.id}" data-receipt-row="${i.id}" aria-pressed="${selected===i.id}"><span style="opacity:.5">${String(i.id+1).padStart(2,'0')}</span><span class="line-text">${esc(i.original)}<small>${esc(i.name)}${i.review&&!i.reviewed?' · PRICE CHANGED':''}</small><span class="receipt-claims">${i.others.map(o=>`<span style="background:${people[o.p][1]}">${people[o.p][0]} ${frac(o.f)}</span>`).join('')}${i.mine?`<span style="background:#ffc23a">You ${frac(i.mine)}</span>`:''}${room(i)<.0001?'<span>Fully claimed</span>':''}</span></span><span class="money">${money(i.printed)}<small>${i.tax?'HST':''}</small></span></button>`}
function VariantB(){return `${header()}<main class="work receipt-layout"><section class="receipt-stage" aria-label="Whole receipt"><div class="receipt-tools"><span>Read your receipt. Claim as you go.</span><span class="receipt-key"><span><i class="dot"></i>You</span><span><i class="dot" style="background:var(--sage)"></i>Others</span></span></div><div class="receipt-scroll"><div class="paper"><div class="receipt-title">T&T Supermarket</div><div class="receipt-address">大統華超級市場<br>Waterloo · Ontario<br>12 OCT 2026 &nbsp; 16:42 &nbsp; REGISTER 06<br>TRANSACTION 008417 · 44 ITEMS</div><div class="paper-rule"></div><div class="flex between small"><span>ITEM / DESCRIPTION</span><span>CAD</span></div>${items.map(receiptLine).join('')}<div class="paper-rule"></div><div class="flex between"><span>SUBTOTAL</span><span>${money(sum(i=>i.printed))}</span></div><div class="flex between"><span>HST</span><span>${money(sum(i=>i.tax))}</span></div><div class="flex between" style="font-weight:bold"><span>TOTAL</span><span>${money(total())}</span></div><p style="text-align:center;margin-top:20px">THANK YOU · 謝謝惠顧</p></div></div></section>${panel(items[selected],true)}</main>${footer()}`}
function tableRow(i){return `<tr class="table-row ${selected===i.id?'selected':''}" data-table-row="${i.id}"><td><button class="icon-btn" data-action="expand" data-id="${i.id}" aria-label="${expanded.has(i.id)?'Collapse':'Expand'} evidence for ${esc(i.name)}" aria-expanded="${expanded.has(i.id)}">${expanded.has(i.id)?'⌄':'›'}</button></td><td><button class="row-select" data-action="select" data-id="${i.id}"><span class="item-name">${esc(i.name)}</span><p class="original mono">${esc(i.original)}</p>${i.review&&!i.reviewed?'<span class="badge">Price changed — review</span>':''}</button></td><td class="money" style="font-weight:600">${money(i.final)}</td><td>${meter(i)}<div class="legend">${i.others.map(o=>`<span class="flex" style="gap:3px">${avatar(o.p)} ${frac(o.f)}</span>`).join('')}<span>${free(i)<.0001?'Fully claimed':frac(free(i))+' free'}</span></div></td><td>${choices(i,true)}</td><td style="text-align:right"><span class="your-amount money">${i.mine?money(Math.round(i.final*i.mine)):'—'}</span>${i.mine?`<br><button class="clear-inline" data-action="remove" data-id="${i.id}">Remove</button>`:''}</td></tr>${expanded.has(i.id)?`<tr class="inline-details"><td colspan="6"><div class="detail-expansion"><div><span class="eyebrow">Item on the receipt</span>${crop(i)}</div><div><span class="eyebrow">How this cost was calculated</span>${breakdown(i)}</div><div>${notice(i)}<p class="original mono">${esc(i.original)}</p><div style="margin-top:15px">${help(i)}</div></div></div></td></tr>`:''}`}
function VariantC(){return `${header()}<main class="work table-work"><div class="table-toolbar"><div><h2>Items & claims <span class="muted small" style="font-family:DM;letter-spacing:0;margin-left:10px">Pick directly in each row</span></h2></div><div class="flex">${filterControls()}</div></div><div class="table-scroll"><table class="claim-table"><colgroup><col style="width:4%"><col style="width:27%"><col style="width:8%"><col style="width:18%"><col style="width:34%"><col style="width:9%"></colgroup><thead><tr><th><span class="sr-only">Evidence</span></th><th>Item / original receipt text</th><th>Final cost</th><th>Everyone's portions</th><th>Your portion</th><th style="text-align:right">Your amount</th></tr></thead><tbody>${visibleItems().map(tableRow).join('')}</tbody></table>${visibleItems().length?'':'<p class="empty">No items in this filter.</p>'}</div><div class="table-key"><kbd>J</kbd> <kbd>K</kbd> focus row &nbsp;·&nbsp; <kbd>1</kbd>–<kbd>7</kbd> pick portion, left to right &nbsp;·&nbsp; <kbd>Enter</kbd> receipt & cost details &nbsp;·&nbsp; Prices include allocated tax</div></main>${footer()}`}
function focusModal(){const i=items[selected];return `<div class="backdrop"></div><section class="focus-modal" role="dialog" aria-modal="true" aria-labelledby="focus-title"><header class="focus-head"><div><div class="eyebrow">Claim an item · ${i.id+1} of 44</div><h2 id="focus-title">${esc(i.name)}</h2></div><button class="icon-btn" data-action="close-focus" aria-label="Close claim">×</button></header><div class="focus-columns"><div class="focus-left">${notice(i)}<div><span class="eyebrow">Item on the receipt</span>${crop(i)}</div><div><span class="eyebrow">On the receipt</span><p class="original mono">${esc(i.original)}</p></div><div><span class="eyebrow">How this cost was calculated</span>${breakdown(i)}</div></div><div class="focus-right">${portion(i)}${choices(i)}${help(i)}<div>${i.mine?`<button class="text-btn" data-action="remove" data-id="${i.id}">Remove my claim</button>`:''}</div><label class="auto-note"><input id="auto-advance" type="checkbox" ${autoAdvance?'checked':''}> After picking, move to the next open item</label></div></div><div class="focus-progress"><div class="flex between"><span class="eyebrow">Your progress · ${claimed()} of 44 picked</span><span class="focus-note"><i class="dot"></i>Yours &nbsp; ◻ Needs review &nbsp; ■ Taken by others</span></div><div class="progress-cells" role="group" aria-label="Jump to an item">${items.map(j=>`<button class="progress-cell ${j.mine?'yours':''} ${room(j)<.0001?'taken':''} ${j.review&&!j.reviewed?'review':''} ${j.id===selected?'current':''}" data-action="select" data-id="${j.id}" aria-label="Item ${j.id+1}: ${esc(j.name)}${j.mine?', picked by you':''}${j.review&&!j.reviewed?', needs review':''}${room(j)<.0001?', fully claimed':''}" aria-pressed="${j.id===selected}" title="${j.id+1}. ${esc(j.name)}"></button>`).join('')}</div><div class="focus-nav"><button class="btn" data-action="prev" ${selected===0?'disabled':''}>← Previous</button><button class="text-btn" data-action="skip">Skip this item</button><div class="flex"><span class="focus-note"><kbd>←</kbd> <kbd>→</kbd> navigate</span><button class="primary" data-action="next" ${selected===43?'disabled':''}>Next item →</button></div></div></div></section>`}
function VariantD(){return `${header()}<div class="background-bill" ${focusOpen?'inert':''}>${list()}<aside class="background-summary"><h3>Bill overview</h3><dl class="breakdown"><div><dt>44 grocery items</dt><dd>${money(total())}</dd></div><div><dt>Your current share</dt><dd>${money(share())}</dd></div></dl><div class="rule" style="padding-top:18px"><span class="eyebrow">Participants</span>${people.map((p,n)=>`<div class="flex" style="margin-top:14px">${avatar(n)}<span>${p[0]}</span></div>`).join('')}</div></aside></div>${focusOpen?focusModal():`<div style="position:fixed;right:60px;top:240px;z-index:4"><button class="primary" data-action="open-focus">Continue claiming</button></div>`}${footer()}`}
function render(keepScroll=true){const scrolls={};if(keepScroll)document.querySelectorAll('.item-list,.pane,.receipt-scroll,.table-scroll,.focus-columns').forEach(e=>scrolls[e.className]=e.scrollTop);app.innerHTML=({A:VariantA,B:VariantB,C:VariantC,D:VariantD})[variant]();document.querySelectorAll('.item-list,.pane,.receipt-scroll,.table-scroll,.focus-columns').forEach(e=>{if(scrolls[e.className])e.scrollTop=scrolls[e.className]});document.getElementById('switcher').innerHTML=`<button data-action="variant-prev" aria-label="Previous layout">‹</button><span class="switcher-label"><small>PROTOTYPE</small>${variant} · ${names[variant]}</span><button data-action="variant-next" aria-label="Next layout">›</button>`;document.body.dataset.variant=variant;document.title=`${variant} · ${names[variant]} — ShareTally prototype`;const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);}
function toast(s){document.getElementById('announcer').textContent=s;document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2600)}
function scrollSelected(){const selector=variant==='B'?'[data-receipt-row="'+selected+'"]':variant==='C'?'[data-table-row="'+selected+'"]':'[data-row="'+selected+'"]';const target=document.querySelector(selector);if(target)target.scrollIntoView({block:'nearest',behavior:'instant'})}
function selectItem(id){clearTimeout(advanceTimer);selected=Math.max(0,Math.min(43,Number(id)));render();scrollSelected();document.getElementById('announcer').textContent=`Item ${selected+1} of 44: ${items[selected].name}`}
function move(delta){const visible=(variant==='A'||variant==='C')?visibleItems():items;const at=visible.findIndex(i=>i.id===selected);const next=visible[at+delta];if(next)selectItem(next.id)}
function nextOpen(){for(let d=1;d<=44;d++){const i=items[(selected+d)%44];if(room(i)>.0001&&(!i.mine||i.review&&!i.reviewed)){selectItem(i.id);return}}toast('You have picked a portion of every available item.')}
function pick(id,f){clearTimeout(advanceTimer);const i=items[id];if(f<0||f>room(i)+.0001)return;selected=Number(id);i.mine=f;confirmed=false;render();document.getElementById('announcer').textContent=`${frac(f)} of ${i.name} picked. Your share ${money(share())}.`;if(variant==='D'&&autoAdvance&&focusOpen&&f>0&&!(i.review&&!i.reviewed))advanceTimer=setTimeout(nextOpen,600)}
function cycle(d){clearTimeout(advanceTimer);const keys=Object.keys(names);variant=keys[(keys.indexOf(variant)+d+4)%4];focusOpen=true;render(false);scrollSelected();console.info('Prototype state', {variant,selectedItem:selected+1,pickedItems:claimed(),shareCents:share(),items:items.map(i=>({name:i.name,mine:frac(i.mine),others:i.others,needsReview:i.review&&!i.reviewed}))})}
function summary(){const d=document.getElementById('summary-dialog');d.innerHTML=`<div class="dialog-inner"><div class="dialog-title"><div><span class="eyebrow">Printed totals · CAD</span><h2 id="summary-title">Receipt summary</h2></div><button class="icon-btn" data-action="close-summary" aria-label="Close receipt summary">×</button></div><p class="help">T&T Supermarket · October 12, 2026 · 44 items</p><dl class="breakdown"><div><dt>Subtotal</dt><dd>${money(sum(i=>i.printed))}</dd></div><div><dt>Discount</dt><dd>−$0.00</dd></div><div><dt>Tax · HST</dt><dd>${money(sum(i=>i.tax))}</dd></div><div><dt>Other adjustments</dt><dd>$0.00</dd></div><div class="final"><dt>Receipt total</dt><dd>${money(total())}</dd></div><div><dt>Your share · ${claimed()} items</dt><dd style="font-weight:700">${money(share())}</dd></div></dl><p class="help">Your share includes each item's tax. These are fictional receipt totals; this prototype submits nothing.</p><button class="btn" data-action="close-summary" style="width:100%">Back to claiming</button></div>`;d.showModal()}
function openCustom(id){clearTimeout(advanceTimer);customId=Number(id);const i=items[id],d=document.getElementById('custom-dialog');const f=frac(i.mine||1/6).split('/');d.innerHTML=`<form method="dialog" class="dialog-inner" id="custom-form"><div class="dialog-title"><div><span class="eyebrow">${esc(i.name)}</span><h2 id="custom-title">Choose a fraction</h2></div><button type="button" class="icon-btn" data-action="close-custom" aria-label="Close custom portion">×</button></div><p class="help">Up to ${frac(room(i))} of this item is available to you.</p><div class="custom-fields"><label>Parts you take<input name="numerator" type="number" min="1" max="1000" step="1" value="${f[0]}" required></label><span style="padding-bottom:10px">of</span><label>Total equal parts<input name="denominator" type="number" min="1" max="1000" step="1" value="${f[1]||1}" required></label></div><p class="error" id="custom-error" role="alert"></p><button class="primary" type="submit">Use this portion</button></form>`;d.showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=Number(b.dataset.id);if(a==='variant-next')cycle(1);else if(a==='variant-prev')cycle(-1);else if(a==='select')selectItem(id);else if(a==='pick')pick(id,Number(b.dataset.fraction));else if(a==='remove')pick(id,0);else if(a==='prev')move(-1);else if(a==='next')move(1);else if(a==='skip')nextOpen();else if(a==='filter'){filter=b.dataset.filter;render()}else if(a==='summary')summary();else if(a==='close-summary')document.getElementById('summary-dialog').close();else if(a==='custom')openCustom(id);else if(a==='close-custom')document.getElementById('custom-dialog').close();else if(a==='expand'){selected=id;expanded.has(id)?expanded.delete(id):expanded.add(id);render()}else if(a==='review'){items[id].reviewed=true;confirmed=false;render();toast('Updated price reviewed. Confirm when your portions are ready.')}else if(a==='next-review'){const first=pending()[0];if(first){filter='All';selectItem(first.id);if(variant==='C'){expanded.add(first.id);render();scrollSelected()}}}else if(a==='confirm'){clearTimeout(advanceTimer);if(pending().length){toast('Review the '+pending().length+' changed prices before confirming.');const i=pending()[0];filter='All';selectItem(i.id);if(variant==='C'){expanded.add(i.id);render();scrollSelected()}}else{confirmed=true;render();toast('Share confirmed in this demo · '+money(share()))}}else if(a==='close-focus'){clearTimeout(advanceTimer);focusOpen=false;render();document.querySelector('[data-action="open-focus"]').focus()}else if(a==='open-focus'){focusOpen=true;render();document.querySelector('[data-action="close-focus"]').focus()}});
document.addEventListener('change',e=>{if(e.target.id==='auto-advance'){autoAdvance=e.target.checked;if(!autoAdvance)clearTimeout(advanceTimer)}});

document.addEventListener('submit',e=>{if(e.target.id!=='custom-form')return;e.preventDefault();const n=Number(e.target.elements.numerator.value),d=Number(e.target.elements.denominator.value);if(!Number.isInteger(n)||!Number.isInteger(d)||n<1||d<1||n/d>room(items[customId])+.0001){document.getElementById('custom-error').textContent='Enter a positive fraction within the available portion.';return}document.getElementById('custom-dialog').close();pick(customId,n/d)});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable="true"]')||e.ctrlKey||e.metaKey||e.altKey)return;if(document.querySelector('dialog[open]'))return;if(e.key==='['||e.key===']'){e.preventDefault();cycle(e.key===']'?1:-1);return}if(e.key==='Escape'&&variant==='D'&&focusOpen){focusOpen=false;clearTimeout(advanceTimer);render();return}const back=['ArrowUp','ArrowLeft','k','K'],forward=['ArrowDown','ArrowRight','j','J'];if(back.includes(e.key)||forward.includes(e.key)){e.preventDefault();move(back.includes(e.key)?-1:1)}else if(/^[1-7]$/.test(e.key)){e.preventDefault();const n=Number(e.key)-1,opts=variant==='C'?[1,.5,1/3,.25,.2,1/6]:[1/6,1,.5,1/3,.25,.2];if(n===6)openCustom(selected);else pick(selected,opts[n])}else if(e.key==='Enter'&&variant==='C'&&e.target===document.body){expanded.has(selected)?expanded.delete(selected):expanded.add(selected);render()} });
// A light focus trap for the custom focus surface. Native dialogs handle their own trap.
document.addEventListener('keydown',e=>{if(e.key!=='Tab'||variant!=='D'||!focusOpen||document.querySelector('dialog[open]'))return;const elements=[...document.querySelectorAll('.focus-modal button:not(:disabled),.focus-modal input,.footer button,.switcher button')];const first=elements[0],last=elements[elements.length-1];if(e.shiftKey&&(document.activeElement===first||!elements.includes(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!elements.includes(document.activeElement))){e.preventDefault();first.focus()}});
render();
</script>
</body>
</html>
