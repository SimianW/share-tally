server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    # Compress static text files. text/html is always included. Caddy adds Via,
    # and without gzip_proxied Nginx would not compress requests carrying it.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml font/ttf text/plain;

    # Same-origin API calls keep the existing frontend fetch('/api/me') working.
    location /api/ {
        # API responses, including the group SSE stream, pass through unchanged.
        gzip off;
        proxy_pass http://api:3000;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every file name here, so a changed file gets a
    # new URL. A missing one is a 404: the SPA fallback would be cached as code.
    location /assets/ {
        try_files $uri =404;
        include security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Revalidate so a deployment's new asset names reach browsers immediately.
    location = /index.html {
        include security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Unhashed public files below keep their URLs across deployments.
    location /fonts/ {
        # mime.types has no ttf entry; without one these are not compressed.
        types {
            font/ttf ttf;
            font/woff2 woff2;
            text/plain txt;
        }
        include security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        include security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
