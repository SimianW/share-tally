# Included by each static location in nginx.conf. A location that sets any
# add_header drops the server's, so these cannot live at server level without
# also reaching /api/. HSTS belongs at the TLS edge; see
# docs/implementation/issue-192-static-delivery.md.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# Empty except on 404, and Nginx skips empty headers. A location's own
# Cache-Control omits `always`, so it never reaches a 404.
add_header Cache-Control $missing_cache_control always;
