name: share-tally

services:
  api:
    image: ghcr.io/simianw/share-tally-api:${IMAGE_TAG:?Set IMAGE_TAG to a tested commit SHA}
    restart: unless-stopped
    init: true
    env_file: .env.production
    networks:
      - app
      - database
    # Health reflects the database only until the first readiness success, which
    # gates `up --wait` and web startup. After that it reflects only API liveness;
    # a healthy container does not prove the database is reachable. An idle API
    # must not query the database, so a managed database can suspend. Compose
    # does not restart unhealthy containers.
    healthcheck:
      test: [CMD, node, dist/healthcheck.js]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    image: ghcr.io/simianw/share-tally-web:${IMAGE_TAG:?Set IMAGE_TAG to a tested commit SHA}
    restart: unless-stopped
    ports:
      - "127.0.0.1:11119:80"
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    # Liveness through Nginx: proves the proxy reaches a responding API without
    # also failing the web container during a database outage.
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/api/health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  app:
  database:
    external: true
    name: 1panel-network
