kind: pipeline
type: docker
name: checks

# Socket access requires a trusted repository. Do not enable this pipeline for
# untrusted pull_request events: its steps control the deployment host's Docker.
trigger:
  event: [push]

# Checks for any branch may overlap; releases run in the separate pipeline below.
concurrency:
  limit: 3

volumes:
  - name: docker-socket
    host:
      path: /var/run/docker.sock

steps:
  - name: test-and-build
    image: docker:27-cli
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    commands:
      - sh deploy/check.sh

---
kind: pipeline
type: docker
name: release

trigger:
  branch: [main]
  event: [push]

depends_on:
  - checks

# Drone limits concurrency per named pipeline, so main releases run one at a
# time. deploy/deploy.sh skips a release whose commit is no longer main's head.
concurrency:
  limit: 1

volumes:
  - name: docker-socket
    host:
      path: /var/run/docker.sock
  - name: deployment
    host:
      path: /opt/repo/share-tally

steps:
  - name: publish-images
    image: docker:27-cli
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    environment:
      GHCR_USERNAME:
        from_secret: GHCR_USERNAME
      GHCR_TOKEN:
        from_secret: GHCR_TOKEN
      VITE_CLERK_PUBLISHABLE_KEY:
        from_secret: VITE_CLERK_PUBLISHABLE_KEY
    commands:
      - sh deploy/publish.sh

  - name: deploy
    image: docker:27-cli
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
      - name: deployment
        path: /opt/repo/share-tally
    environment:
      GHCR_USERNAME:
        from_secret: GHCR_USERNAME
      GHCR_TOKEN:
        from_secret: GHCR_TOKEN
    commands:
      - sh deploy/deploy.sh
