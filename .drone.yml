kind: pipeline
type: docker
name: share-tally

# Socket access requires a trusted repository. Do not enable this pipeline for
# untrusted pull_request events: check/publish steps control the CI host's Docker.
trigger:
  event: [push]

# Run one build at a time. The browser release gate is load-sensitive and must
# not share the host with another build's gate. Serial builds also stop main's
# migrations and deploys from overlapping.
concurrency:
  limit: 1

volumes:
  - name: docker-socket
    host:
      path: /var/run/docker.sock
  - name: deployment
    host:
      path: /opt/repo/share-tally

steps:
  - name: test-and-build
    image: docker:27-cli
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    commands:
      - sh deploy/check.sh

  # Release gate: a failing browser scenario stops publish and deploy. Runs
  # only for trusted pushes to main, never for pull_request events.
  - name: browser-tests
    image: docker:27-cli
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    commands:
      - sh deploy/browser-check.sh
    when:
      branch: [main]
      event: [push]

  - name: publish-images
    image: docker:27-cli
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    environment:
      GHCR_USERNAME:
        from_secret: GHCR_USERNAME
      GHCR_TOKEN:
        from_secret: GHCR_TOKEN
      VITE_CLERK_PUBLISHABLE_KEY:
        from_secret: VITE_CLERK_PUBLISHABLE_KEY
    commands:
      - sh deploy/publish.sh
    when:
      branch: [main]
      event: [push]

  - name: deploy
    image: public.ecr.aws/docker/library/node:24-alpine
    environment:
      RAILWAY_PROJECT_TOKEN:
        from_secret: RAILWAY_PROJECT_TOKEN
      RAILWAY_PROJECT_ID:
        from_secret: RAILWAY_PROJECT_ID
      RAILWAY_ENVIRONMENT_ID:
        from_secret: RAILWAY_ENVIRONMENT_ID
      RAILWAY_API_SERVICE_ID:
        from_secret: RAILWAY_API_SERVICE_ID
      RAILWAY_WEB_SERVICE_ID:
        from_secret: RAILWAY_WEB_SERVICE_ID
    commands:
      - apk add --no-cache git
      - sh deploy/deploy.sh
    when:
      branch: [main]
      event: [push]
