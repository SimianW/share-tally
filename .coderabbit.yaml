# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reads this file from the PR's head branch, so config changes apply
# to the PR that makes them. Reference: https://docs.coderabbit.ai/reference/configuration
language: "en-US"
tone_instructions: >-
  Be concise and friendly. The owner is learning TypeScript, React and SQL:
  briefly explain why a finding matters, especially for money, concurrency and
  authorization. Use the glossary terms from CONTEXT.md.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: true
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false
    # Feature PRs are often stacked on other feature branches, not main.
    base_branches:
      - ".*"

  # Excluded paths are also left out of CodeRabbit's sparse checkout.
  path_filters:
    - "!**/pnpm-lock.yaml"
    - "!server/drizzle/meta/**"
    - "!server/src/generated/**"
    - "!client/public/fonts/**"
    - "!docs/reviews/evidence/**"
    - "!docs/images/**"
    - "!research/archive/**"

  path_instructions:
    - path: "server/src/**/*.ts"
      instructions: |
        Express 5 + Drizzle ORM + PostgreSQL backend. Focus on financial correctness and multi-user safety:
        - Money is integer cents; exact shares use BigInt fractions (fractions.ts, money.ts). Flag any
          floating-point arithmetic on amounts, rounding before the final personal total, or unchecked
          conversion from bigint to number.
        - Every route must check that the signed-in user is a member of the group and allowed to act on
          the bill, item claim, or repayment record. Flag data from another group leaking into a response.
        - Reads that decide a write, and multi-row writes, belong in one db.transaction with suitable
          locking or conditional updates. Flag lost-update and double-submit races.
        - Validate request input at the boundary (zod / input-validation.ts) and return errors via BillError
          with an accurate status code.
        - Read the ADRs in docs/adr that touch the changed behaviour and flag any contradiction, naming
          the ADR.

    - path: "server/src/{receipt-*,azure-receipt}.ts"
      instructions: |
        Receipt pipeline. Read the receipt-related ADRs in docs/adr and flag changes that contradict them,
        naming the ADR. External provider failures and timeouts must leave the bill draft usable
        (fallback, not data loss).

    - path: "server/{src/db/schema.ts,drizzle/*.sql}"
      instructions: |
        Schema and migrations. Migrations are generated by drizzle-kit from schema.ts; the SQL must match the
        schema change, and already-merged migration files must never be edited. Check constraints, foreign
        keys and ON DELETE behaviour, unique indexes that enforce invariants, and indexes for new query
        paths. Flag migrations that could lose data or lock large tables when applied on deploy.

    - path: "server/test/**/*.ts"
      instructions: |
        node:test integration tests against a real PostgreSQL (Testcontainers) through the HTTP API
        (server-process.ts). Prefer tests that assert observable behaviour through the public API over
        internal functions. Check that financial edge cases, authorization failures and concurrent
        requests are covered for the behaviour changed in the PR. Flag flaky timing assumptions.

    - path: "client/src/**/*.{ts,tsx}"
      instructions: |
        React + Vite + TanStack Query client with Clerk sign-in. The server is the source of truth for
        amounts and balances; flag client-side financial calculations that could disagree with it (display
        formatting and input parsing are fine). Check query-cache invalidation after mutations, loading and
        error states, accessible labels and keyboard use, and that layouts still work on mobile widths.

    - path: "client/src/**/*.css"
      instructions: |
        Check for layout regressions on mobile widths, sufficient colour contrast and visible focus styles.
        Do not nitpick formatting.

    - path: "client/scripts/**"
      instructions: |
        Browser smoke scripts. Check they wait on real UI conditions rather than fixed sleeps and clean up
        any data they create.

    - path: "{Dockerfile,.dockerignore,.drone.yml,deploy/**}"
      instructions: |
        Build, CI and deployment. The Drone pipeline has access to the host Docker socket and deploys pushes
        to main. Flag secrets committed to the repo or printed to logs, pipelines that could run on untrusted
        pull requests, unpinned or mutable base images, and deploy steps that could run migrations and app
        updates out of order.

    - path: ".github/workflows/**"
      instructions: |
        GitHub Actions. Check least-privilege `permissions`, actions pinned to full commit SHAs, safe handling
        of `pull_request_target` / comment triggers, and that untrusted PR content is never interpolated into
        shell scripts.

    - path: "CONTEXT.md"
      instructions: |
        Domain glossary. Each term needs a one-paragraph definition and, where useful, an `_Avoid_:` line.
        Check that new terms don't conflict with existing ones or with language used in code and ADRs.

    - path: "docs/adr/**"
      instructions: |
        Architecture decision records. Each ADR states the decision, its reason and consequences. An accepted
        decision should not be silently rewritten: a change of decision needs a new ADR that names the one it
        supersedes. Check consistency with CONTEXT.md terminology and other ADRs.

    - path: "{docs/drafts,docs/research,research}/**"
      instructions: |
        Background notes, not approved requirements. Only flag factual errors, broken links, or contradictions
        with accepted ADRs; skip style feedback.

knowledge_base:
  code_guidelines:
    enabled: true
    # Added to CodeRabbit's defaults, which already include AGENTS.md and CLAUDE.md.
    # A plain string only governs files under the guideline's own directory, so
    # the ADRs need an explicit applyTo to reach the code they constrain.
    filePatterns:
      - "CONTEXT.md"
      - files: "docs/adr/*.md"
        applyTo: "**/*"

chat:
  auto_reply: true
